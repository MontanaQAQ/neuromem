[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isage-neuromem"
version = "0.1.0"
description = "NeuroMem - Brain-inspired memory system for AI agents with multi-modal storage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "IntelliStream Team", email = "shuhao_zhang@hust.edu.cn"}
]
keywords = ["memory", "ai", "agents", "vector-database", "knowledge-graph", "rag", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

dependencies = [
    # SAGE components (already on PyPI)
    "isage-common>=0.2.0",  # For logging, embedding, config
    "isagedb>=0.1.6",  # SageDB vector database
    
    # Core dependencies
    "numpy>=1.26.0,<2.3.0",
    "pyyaml>=6.0,<7.0",
    "networkx>=3.0,<4.0",
    "python-dateutil>=2.8.0",
    
    # Optional but recommended
    "redis>=5.0.0,<6.0.0",
    "neo4j>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
full = [
    "redis>=5.0.0,<6.0.0",
    "neo4j>=5.0.0,<6.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/intellistream/NeuroMem"
Documentation = "https://intellistream.github.io/SAGE/"
Repository = "https://github.com/intellistream/NeuroMem"
"Bug Tracker" = "https://github.com/intellistream/NeuroMem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuromem*"]
exclude = ["tests*", "examples*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B905",   # zip without strict (Python 3.9 compatibility)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
