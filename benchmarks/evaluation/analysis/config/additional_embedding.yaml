# ============================================================================
# additional_embedding.yaml
#
# 补充实验：Embedding 模型对比分析配置
# 对比 BAAI/bge-m3 vs intfloat/e5-large-v2
# ============================================================================

dataset:
  name: "locomo"
  description: "LoCoMo - Additional Embedding Comparison (bge-m3 vs e5-large-v2)"

# 实验名称（用于报告标题）
name: "Embedding Model Comparison (D2 Normalization)"

# 数据路径配置
paths:
  base_dir: ".sage/benchmarks/benchmark_memory/locomo"
  output_dir: ".sage/benchmarks/benchmark_memory/locomo/output/round_analysis_additional_embedding"

# 实验目录前缀（自动发现时使用）
prefixes:
  - "PreInsert_Mem0g_"
  - "Additional_Mem0g_"

# 评估器配置
evaluator:
  name: "locomo"

# 指标配置
metrics:
  - name: "f1"
    display_name: "F1 Score"
    ylabel: "F1 Score"
    description: "Token-level F1 with Porter Stemmer"

  - name: "insert_time"
    display_name: "Insert Time per Item"
    ylabel: "Time (ms)"
    description: "Average insert time per memory item"

  - name: "retrieval_time"
    display_name: "Retrieval Time per Query"
    ylabel: "Time (ms)"
    description: "Average retrieval time per query"

# Category 配置
categories:
  labels:
    1: "Multi-answer"
    2: "Single-answer"
    3: "Clean-semicolon"
    4: "Standard"
    5: "Info-not-mentioned"

# 输出配置
output:
  # 输出格式
  formats:
    - "csv"      # CSV数据表
    - "md"       # Markdown报告
    - "json"     # JSON原始数据

  # 图表配置
  charts:
    single_strategy: true       # 单策略图
    comparison: true            # 对比图
    cost_effectiveness: true    # 成本效益图
    category: true              # 类别对比图

  # 图表样式
  style:
    figure_size: [10, 6]
    dpi: 300
    font_size: 12
    line_width: 2
    marker_size: 8
    grid: true
    legend_location: "best"

# ============================================================================
# 补充实验特定配置
# ============================================================================

# 对比组定义
comparison_groups:
  # 组1: None 策略下的 embedding 对比
  - name: "None Strategy"
    strategies:
      - name: "bge-m3"
        path: "PreInsert_Mem0g_none"
        label: "bge-m3 (None)"
      - name: "e5-large-v2"
        path: "Additional_Mem0g_none_e5_large"
        label: "e5-large-v2 (None)"

  # 组2: Rewrite 策略下的 embedding 对比
  - name: "Rewrite Strategy"
    strategies:
      - name: "bge-m3"
        path: "PreInsert_Mem0g_rewrite_triplet_extract"
        label: "bge-m3 (Rewrite)"
      - name: "e5-large-v2"
        path: "Additional_Mem0g_rewrite_e5_large"
        label: "e5-large-v2 (Rewrite)"

# 分析维度
analysis_dimensions:
  - name: "Embedding Quality"
    description: "向量检索质量对比"
    metrics:
      - "f1"
      - "retrieval_time"

  - name: "PreInsert Impact"
    description: "预处理策略在不同 embedding 下的影响"
    metrics:
      - "f1"
      - "insert_time"

# 报告配置
report:
  title: "Embedding Model Comparison: bge-m3 vs e5-large-v2"
  sections:
    - "Executive Summary"
    - "Methodology"
    - "Results"
    - "Discussion"
    - "Conclusions"

  highlights:
    - "F1 score差异 (按策略分组)"
    - "检索时间对比"
    - "成本效益分析"
    - "推荐embedding选择"
