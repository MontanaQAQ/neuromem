# ============================================================================
# additional_model_qwen.yaml
#
# 补充实验：Qwen-Plus 模型下 PreInsert 策略对比分析配置
# 对比 PanGu-1B vs Qwen-Plus (D2 Normalization)
# ============================================================================

dataset:
  name: "locomo"
  description: "LoCoMo - LLM Model Comparison: PanGu-1B vs Qwen-Plus (PreInsert Strategies)"

# 实验名称（用于报告标题）
name: "LLM Model Comparison: PanGu-1B vs Qwen-Plus (D2 Normalization)"

# 数据路径配置
paths:
  base_dir: ".sage/benchmarks/benchmark_memory/locomo"
  output_dir: ".sage/benchmarks/benchmark_memory/locomo/output/round_analysis_additional_model_qwen"

# 限制评估的任务列表（为公平对比，使用Qwen rewrite实际运行的8个任务）
# 注意: Qwen rewrite只跑了8个任务，其他实验跑了10个，统一使用这8个
tasks:
  - "conv-26"
  - "conv-30"
  - "conv-41"
  - "conv-42"
  - "conv-43"
  - "conv-44"
  - "conv-47"
  - "conv-48"

# 实验目录前缀（自动发现时使用）
prefixes:
  - "PreInsert_Mem0g_"
  - "Additional_Qwen_Mem0g_"

# 评估器配置
evaluator:
  name: "locomo"

# 指标配置
metrics:
  - name: "f1"
    display_name: "F1 Score"
    ylabel: "F1 Score"
    description: "Token-level F1 with Porter Stemmer"

  - name: "insert_time"
    display_name: "Insert Time per Item"
    ylabel: "Time (ms)"
    description: "Average insert time per memory item"

  - name: "retrieval_time"
    display_name: "Retrieval Time per Query"
    ylabel: "Time (ms)"
    description: "Average retrieval time per query"

# Category 配置
categories:
  labels:
    1: "Multi-answer"
    2: "Single-answer"
    3: "Clean-semicolon"
    4: "Standard"
    5: "Info-not-mentioned"

# 输出配置
output:
  # 输出格式
  formats:
    - "csv"      # CSV数据表
    - "md"       # Markdown报告
    - "json"     # JSON原始数据

  # 图表配置
  charts:
    single_strategy: true       # 单策略图
    comparison: true            # 对比图
    cost_effectiveness: true    # 成本效益图
    category: true              # 类别对比图

  # 图表样式
  style:
    figure_size: [10, 6]
    dpi: 300
    font_size: 12
    line_width: 2
    marker_size: 8
    grid: true
    legend_location: "best"

# ============================================================================
# 补充实验特定配置
# ============================================================================

# 对比组定义
comparison_groups:
  - name: "PanGu-1B (Original)"
    strategies:
      - name: "PanGu_None"
        path: "PreInsert_Mem0g_none"
        label: "PanGu + None"
      - name: "PanGu_Rewrite"
        path: "PreInsert_Mem0g_rewrite_triplet_extract"
        label: "PanGu + Rewrite"

  - name: "Qwen-Plus (Additional)"
    strategies:
      - name: "Qwen_None"
        path: "Additional_Qwen_Mem0g_none"
        label: "Qwen + None"
      - name: "Qwen_Rewrite"
        path: "Additional_Qwen_Mem0g_rewrite"
        label: "Qwen + Rewrite"

# 分析维度
analysis_dimensions:
  - name: "Triple Extraction Quality"
    description: "三元组抽取质量对比"
    metrics:
      - "f1"
      - "insert_time"

  - name: "LLM Model Impact"
    description: "LLM模型影响分析"
    metrics:
      - "f1"
      - "category_f1"

# 报告配置
report:
  title: "LLM Model Comparison: PanGu-1B vs Qwen-Plus (PreInsert Strategies)"
  sections:
    - "Executive Summary"
    - "Methodology"
    - "Results"
    - "Discussion"
    - "Conclusions"

  highlights:
    - "LLM模型对F1 score的影响 (PanGu vs Qwen)"
    - "PreInsert策略对比 (None vs Rewrite)"
    - "三元组抽取质量分析"
    - "模型-策略组合的最优选择"
    - "各类别问题表现差异"
