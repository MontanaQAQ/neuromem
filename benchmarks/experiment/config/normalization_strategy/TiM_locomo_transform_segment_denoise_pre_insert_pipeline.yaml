---
# TiM (pre_insert=transform.segment_denoise) - locomo 变体
runtime:
  dataset: "locomo"
  memory_insert_verbose: false
  memory_test_verbose: true
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Based on the context above, provide a brief, direct answer to the question. No explanation, no reasoning, no elaboration - just the answer.
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  max_tokens: 256
  temperature: 0
  seed: 42
  memory_name: "TiM"
  embedding_base_url: "http://localhost:8091/v1"
  embedding_model: "BAAI/bge-m3"

services:
  services_type: "partitional.lsh_hash"
  lsh_hash:
    embedding_dim: 1024
    num_tables: 10
    hash_size: 128
    n_gram: 3
    threshold: 0.3
  memory_retrieval_adapter: "none"

operators:
  pre_insert:
    action: "transform.segment_denoise"
    transform_type: "topic_segment"
    min_segment_size: 100
    max_segment_size: 500
    segment_prompt: |
      Identify and denoise topic segments to improve triple extraction quality.

  pre_retrieval:
    action: "embedding"

  post_insert:
    action: "conflict_resolution.semantic_consolidation"
    retrieve_count: 10
    min_merge_count: 5
    merge_prompt: |
      You are a memory consolidation expert. Given a list of facts about a person, your job is to:
      1. REMOVE duplicates and near-duplicates (same meaning, different wording)
      2. MERGE related facts into more complete statements
      3. REMOVE logically subsumed facts (if A contains B's meaning, remove B)

      Facts:
      {memories}

      Respond with JSON only:
      {"to_delete": ["exact text 1", "exact text 2"], "to_insert": []}

  post_retrieval:
    action: "none"
    conversation_format_prompt: |
      The following is some history information.
