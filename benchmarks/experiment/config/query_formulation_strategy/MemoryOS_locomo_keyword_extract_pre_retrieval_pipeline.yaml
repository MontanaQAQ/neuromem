# ============================================================
# PreRetrieval 实验: MemoryOS + Keyword Extract
# 记忆体结构: MemoryOS (三层STM/MTM/LPM架构)
# PreRetrieval 策略: keyword_extract
# 配置名称: MemoryOS_locomo_keyword_extract_pre_retrieval_pipeline.yaml
# ============================================================

runtime:
  dataset: locomo
  test_segments: 5
  service_timeout: 600.0

  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM 配置
  # api_key: token-abc123
  # base_url: http://sage2:8000/v1
  # model_name: /home/cyb/Llama-3.1-8B-Instruct
  # max_tokens: 32
  # temperature: 0
  # seed: 42

  # 新配置（PanGu Embedded 1B）：
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  llm_base_url: "http://172.17.0.1:1040/v1"
  llm_model: "pangu_embedded_1b"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: MemoryOS-keyword_extract

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "partitional.feature_queue_segment_combination"
  feature_queue_segment_combination:
    vector_dim: 1024
    fifo_max_size: 20
    segment_strategy: "time"
    segment_threshold: 3600
    enable_feature_extraction: true
    combination_strategy: "weighted"
    weights:
      feature_index: 0.3
      fifo_index: 0.4
      segment_index: 0.3
  memory_retrieval_adapter: "none"

operators:
  pre_insert:
    action: "none"

  post_insert:
    action: "structure_enrichment.heat_migration"
    migrate_policy: "heat"
    heat_threshold: 5.0
    stm_capacity: 20
    upgrade_transform: "none"
    enable_profile_extraction: true
    enable_knowledge_extraction: true
    reset_heat_after_extraction: true

  pre_retrieval:
    action: optimize.keyword_extract
    extractor: llm
    max_keywords: 6
    extract_types:
    - NOUN
    - PROPN
    keyword_prompt: |
      Extract the most important keywords from the following question.
      Focus on entities, concepts, and key terms that would be useful for retrieval.
      Return at most {max_keywords} keywords, separated by commas.

      Question: {question}
      Keywords:

  post_retrieval:
    action: "merge.multi_query"
    merge_strategy: "weighted"
    diversify_results: true
    deduplication_threshold: 0.90
