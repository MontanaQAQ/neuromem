# ============================================================
# PreRetrieval 实验: Mem0ᵍ + Keyword Extract
# 记忆体结构: Mem0ᵍ (语义倒排知识图谱)
# PreRetrieval 策略: keyword_extract
# 配置名称: Mem0g_locomo_keyword_extract_pre_retrieval_pipeline.yaml
# ============================================================

runtime:
  dataset: locomo
  memory_insert_verbose: false
  memory_test_verbose: true
  test_segments: 10
  service_timeout: 600.0

  prompt_template: |
    Based on the above context, answer the following question concisely.

    Question: {question}
    Answer:

  prompt_template_category5: |
    Based on the above context, answer the following question.

    Question: {question}
    Answer:

  # LLM 配置
  # api_key: token-abc123
  # base_url: http://sage2:8000/v1
  # model_name: /home/cyb/Llama-3.1-8B-Instruct
  # max_tokens: 256
  # temperature: 0
  # seed: 42

  # 新配置（PanGu Embedded 1B）：
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  max_tokens: 256
  temperature: 0
  seed: 42
  memory_name: Mem0g-keyword_extract

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "hierarchical.semantic_inverted_knowledge_graph"
  semantic_inverted_knowledge_graph:
    vector_dim: 1024
    hierarchy_levels: 3
    routing_strategy: "parallel"
    enable_cross_layer_query: true
    max_hops: 3
    default_index: "semantic_index"
  memory_retrieval_adapter: "none"

operators:
  pre_insert:
    action: "extract.triple"
    extraction_method: "llm"
    triple_extraction_prompt: |
      You are a knowledge graph builder. Extract factual triples from the dialogue.
      Focus on entities (people, organizations, locations) and their relationships.

      Rules:
      1. Output format: (Subject, Predicate, Object) - one triple per line
      2. Resolve ALL pronouns to actual entity names
      3. Extract relationships, attributes, and temporal information
      4. Be concise and factual

      Dialogue:
      {dialogue}

      Triples:

  post_insert:
    action: "conflict_resolution.llm_crud"
    top_k: 10
    debug_summary_only: true
    decision_prompt: |
      You are a JSON decision API. Output ONLY a single minified JSON object, no prose, no markdown, no code fences.

      Schema:
      {
        "action": "ADD|UPDATE|DELETE|NOOP",
        "to_delete": ["<id>", ...],
        "reason": "<short explanation>"
      }

      Rules:
      - Use UPPERCASE for action exactly as one of ADD, UPDATE, DELETE, NOOP.
      - If uncertain, default to {"action":"ADD","to_delete":[],"reason":"insufficient evidence"}.
      - "to_delete" must contain only IDs present in the Existing facts list (the values inside square brackets []).
      - UPDATE or DELETE: put the affected existing fact IDs into to_delete.
      - NOOP: to_delete must be [].

      Inputs:
      New fact:
      {new_memory}

      Existing facts:
      {existing_memories}

      Now respond with ONLY the JSON object.

  pre_retrieval:
    action: optimize.keyword_extract
    extractor: llm
    max_keywords: 6
    extract_types:
    - NOUN
    - PROPN
    keyword_prompt: |
      Extract the most important keywords from the following question.
      Focus on entities, concepts, and key terms that would be useful for retrieval.
      Return at most {max_keywords} keywords, separated by commas.

      Question: {question}
      Keywords:

  post_retrieval:
    action: "none"
    conversation_format_prompt: |
      The following is some history information.
