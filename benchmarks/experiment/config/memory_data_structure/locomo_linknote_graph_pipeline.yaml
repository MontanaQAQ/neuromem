# ============================================================
# 数据结构实验: Linknote Graph (简单图基线)
# 论文: A-Mem
# 特点: 双向链接图 + 向量检索
# 配置名称: locomo_linknote_graph_pipeline.yaml
# ============================================================

runtime:
  dataset: locomo
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM 配置
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  llm_base_url: "http://172.17.0.1:1040/v1"
  llm_model: "pangu_embedded_1b"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: DataStructure_linknote_graph

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "hierarchical.linknote_graph"
  linknote_graph:
    vector_dim: 1024
    enable_bidirectional_links: true
    max_links_per_node: 10
    link_similarity_threshold: 0.7
  memory_retrieval_adapter: none

# ============================================================
# 统一 Operator 配置（所有数据结构实验相同）
# D2=none, D3=none, D4=embedding, D5=none
# ============================================================
operators:
  pre_insert:
    action: "none"

  post_insert:
    action: "none"

  pre_retrieval:
    action: "embedding"

  post_retrieval:
    action: "none"
