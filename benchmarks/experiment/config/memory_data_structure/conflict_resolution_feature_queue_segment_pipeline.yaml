# ============================================================
# Data Structure Experiment: Feature-Queue-Segment Combination
# Dataset: Conflict Resolution (MemAgentBench)
# Features: BM25 + FIFO + Segment triple index fusion, time-based segmentation
# ============================================================

runtime:
  dataset: conflict_resolution
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM Configuration
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  llm_base_url: "http://172.17.0.1:1040/v1"
  llm_model: "pangu_embedded_1b"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: DataStructure_feature_queue_segment

  # Embedding Configuration
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "partitional.feature_queue_segment_combination"
  feature_queue_segment_combination:
    fifo_max_size: 100
    segment_strategy: "time"
    segment_threshold: 3600
    enable_feature_extraction: true
    combination_strategy: "weighted"
    weights:
      feature_index: 0.4
      fifo_index: 0.3
      segment_index: 0.3
  memory_retrieval_adapter: none

# ============================================================
# Unified Operator Configuration (same for all data structure experiments)
# D2=none, D3=none, D4=embedding, D5=none
# ============================================================
operators:
  pre_insert:
    action: "none"

  post_insert:
    action: "none"

  pre_retrieval:
    action: "embedding"

  post_retrieval:
    action: "none"
