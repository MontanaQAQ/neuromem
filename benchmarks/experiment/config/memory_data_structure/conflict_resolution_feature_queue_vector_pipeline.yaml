# ============================================================
# 数据结构实验: Feature-Queue-Vectorstore Combination (三索引融合)
# 论文: MemGPT
# 特点: BM25 + FIFO + FAISS 三索引融合，RRF融合
# 配置名称: locomo_feature_queue_vector_pipeline.yaml
# ============================================================

runtime:
  dataset: conflict_resolution
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM 配置
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  llm_base_url: "http://172.17.0.1:1040/v1"
  llm_model: "pangu_embedded_1b"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: DataStructure_feature_queue_vectorstore

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "partitional.feature_queue_vectorstore_combination"
  feature_queue_vectorstore_combination:
    # FAISS 向量索引配置
    vector_dim: 1024
    faiss_index_type: "IndexFlatIP"

    # BM25 文本索引配置
    bm25_k1: 1.5
    bm25_b: 0.75

    # FIFO 队列配置
    fifo_max_size: 500

    # 融合策略
    fusion_method: "rrf"          # Reciprocal Rank Fusion
    rrf_k: 60
  memory_retrieval_adapter: none

# ============================================================
# 统一 Operator 配置（所有数据结构实验相同）
# D2=none, D3=none, D4=embedding, D5=none
# ============================================================
operators:
  pre_insert:
    action: "none"

  post_insert:
    action: "none"

  pre_retrieval:
    action: "embedding"

  post_retrieval:
    action: "none"
