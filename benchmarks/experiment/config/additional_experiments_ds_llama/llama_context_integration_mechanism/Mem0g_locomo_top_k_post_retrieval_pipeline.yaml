# ============================================================
# PostRetrieval Experiment (Llama): Mem0g + Top-K Filter
# Memory Structure: Mem0g (Semantic Inverted Knowledge Graph)
# PostRetrieval Strategy: top_k
# Config Name: Llama Mem0g_locomo_top_k_post_retrieval_pipeline.yaml
# ============================================================

runtime:
  dataset: "locomo"
  memory_insert_verbose: false
  memory_test_verbose: true
  test_segments: 5

  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:

  # LLM - Llama unified config
  api_key: "token-abc123"
  base_url: "http://sage2:8001/v1"
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
  llm_base_url: "http://sage2:8001/v1"
  llm_model: "meta-llama/Meta-Llama-3-8B-Instruct"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: "PostRetrieval_Mem0g_top_k_Llama"

  embedding_base_url: "http://localhost:8091/v1"
  embedding_model: "BAAI/bge-m3"

services:
  services_type: "hierarchical.semantic_inverted_knowledge_graph"
  semantic_inverted_knowledge_graph:
    vector_dim: 1024
    hierarchy_levels: 3
    routing_strategy: "parallel"
    enable_cross_layer_query: true
    max_hops: 3
    default_index: "semantic_index"
  memory_retrieval_adapter: "none"

operators:
  pre_insert:
    action: "extract.triple"
    extraction_method: "llm"
    keep_original: false
    max_triplets: 3
    triple_extraction_prompt: |
      You are a knowledge graph builder.
      Extract factual triples from the dialogue.

      Strict Rules (follow exactly):
      - Output ONLY triples, one per line.
      - Exact format: (Subject, Predicate, Object)
      - Use DOUBLE QUOTES only if present in source; otherwise plain text.
      - Resolve ALL pronouns to actual entity names.
      - No headings, no explanations, no markdown, no code fences, no extra text.
      - If no triples: return "None" on a single line.

      Dialogue:
      {dialogue}

      Triples:

  post_insert:
    action: "conflict_resolution.llm_crud"
    top_k: 10
    debug_summary_only: true
    decision_prompt: |
      You are a JSON decision API. Output ONLY a single minified JSON object, no prose, no markdown, no code fences.

      Schema:
      {
        "action": "ADD|UPDATE|DELETE|NOOP",
        "to_delete": ["<id>", ...],
        "reason": "<short explanation>"
      }

      Rules:
      - Use UPPERCASE for action exactly as one of ADD, UPDATE, DELETE, NOOP.
      - If uncertain, default to {"action":"ADD","to_delete":[],"reason":"insufficient evidence"}.
      - "to_delete" must contain only IDs present in the Existing facts list (the values inside square brackets []).
      - UPDATE or DELETE: put the affected existing fact IDs into to_delete.
      - NOOP: to_delete must be [].

      Inputs:
      New fact:
      {new_memory}

      Existing facts:
      {existing_memories}

      Now respond with ONLY the JSON object.

  pre_retrieval:
    action: "embedding"

  post_retrieval:
    action: "top_k"
    k: 3

    conversation_format_prompt: |
      The following is relevant context retrieved from memory.
