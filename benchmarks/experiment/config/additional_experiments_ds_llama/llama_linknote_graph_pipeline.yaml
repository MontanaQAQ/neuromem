# ============================================================
# 数据结构实验: Linknote Graph (简单图基线)
# 论文来源: A-Mem
# 特点: 双向链接图 + 向量检索
# Backbone: Llama-3.1-8B-Instruct (补充实验)
# ============================================================

runtime:
  dataset: locomo
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM 配置 - Llama-3.1-8B
  api_key: "token-abc123"
  base_url: "http://sage2:8001/v1"
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
  llm_base_url: "http://sage2:8001/v1"
  llm_model: "meta-llama/Meta-Llama-3-8B-Instruct"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: Llama_DataStructure_linknote_graph

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "hierarchical.linknote_graph"
  linknote_graph:
    vector_dim: 1024
    enable_bidirectional_links: true
    max_links_per_node: 10
    link_similarity_threshold: 0.7
  memory_retrieval_adapter: none

operators:
  pre_insert:
    action: "none"
  post_insert:
    action: "none"
  pre_retrieval:
    action: "embedding"
  post_retrieval:
    action: "none"
