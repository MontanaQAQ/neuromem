# ============================================================
# 数据结构实验: Feature-Summary-Vectorstore Combination (三索引融合)
# 论文来源: MemoryBank
# 特点: BM25 + Summary + FAISS 三索引融合
# Backbone: Llama-3.1-8B-Instruct (补充实验)
# ============================================================

runtime:
  dataset: locomo
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM 配置 - Llama-3.1-8B
  api_key: "token-abc123"
  base_url: "http://sage2:8001/v1"
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
  llm_base_url: "http://sage2:8001/v1"
  llm_model: "meta-llama/Meta-Llama-3-8B-Instruct"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: Llama_DataStructure_feature_summary_vectorstore

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "partitional.feature_summary_vectorstore_combination"
  feature_summary_vectorstore_combination:
    vector_dim: 1024
    summary_max_size: 50
    combination_strategy: "weighted"
    weights:
      vector_index: 0.5
      feature_index: 0.3
      summary_index: 0.2
    enable_feature_extraction: true
    enable_summary_generation: true
  memory_retrieval_adapter: none

operators:
  pre_insert:
    action: "none"
  post_insert:
    action: "none"
  pre_retrieval:
    action: "embedding"
  post_retrieval:
    action: "none"
