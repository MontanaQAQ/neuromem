# ============================================================
# PostInsert 实验: TiM + LLM CRUD
# 记忆体结构: TiM (LSH哈希桶 + 向量检索)
# PostInsert 策略: conflict_resolution.llm_crud
# 配置名称: TiM_locomo_llm_crud_post_insert.yaml
# ============================================================

runtime:
  dataset: locomo
  test_segments: 5
  service_timeout: 600.0
  prompt_template: |
    Based on the above context, answer the following question concisely.

    Question: {question}
    Answer:
  prompt_template_category5: |
    Based on the above context, answer the following question.

    Question: {question}
    Answer:

  # LLM 配置
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  max_tokens: 256
  temperature: 0
  seed: 42
  memory_name: PostInsert_TiM_llm_crud

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "partitional.lsh_hash"
  lsh_hash:
    vector_dim: 1024
    lsh_nbits: 128
    lsh_rotate_data: true
    lsh_train_thresholds: false
    retrieval_top_k: 10
  memory_retrieval_adapter: none

operators:
  pre_insert:
    action: extract.triple
    extraction_method: llm
    max_triplets: 10
    keep_original: false
    triple_extraction_prompt: |
      You are a factual knowledge extractor.
      Analyze the dialogue below and extract all subject–predicate–object triples that represent explicitly stated or directly inferable real-world facts about people, organizations, objects, preferences, roles, locations, activities, or states.

      Guidelines:
      - Map "I", "me", "my" to the name of the speaker provided in the dialogue log.
      - Include personal states, plans, or situations if clearly described (e.g., "I'm busy" → (Speaker, is, busy)).
      - Handle colloquialisms and omitted subjects: If a subject is implied but omitted, infer the subject from context.
      - Resolve pronouns to specific entities; if the referent is ambiguous, skip the triple. Never output pronouns as subject or object.
      - Avoid redundancy by consolidating repeated or fragmented details into a single, most specific triple, and ignore non-informative conversational fillers.
      - Use natural-language predicates in active voice. Capture specific nuances like time and location directly in the predicate (e.g., "starts at 5 PM", "lives in Tokyo").
      - Do NOT assume external knowledge; base everything on what is said or immediately implied.

      Output ONLY in this format:

      If one or more facts exist:
      (Subject, Predicate, Object)
      ...

      If no extractable facts:
      None

      Dialogue:
      {dialogue}

  pre_retrieval:
    action: embedding

  post_insert:
    action: conflict_resolution.llm_crud
    similarity_threshold: 0.8
    top_k: 5
    debug_summary_only: true
    decision_prompt: |
      You are a JSON decision API. Output ONLY a single minified JSON object, no prose, no markdown, no code fences.

      Schema:
      {
        "action": "ADD|UPDATE|DELETE|NOOP",
        "to_delete": ["<id>", ...],
        "reason": "<short explanation>"
      }

      Rules:
      - Use UPPERCASE for action exactly as one of ADD, UPDATE, DELETE, NOOP.
      - Use double quotes for all JSON strings (not single quotes).
      - If uncertain, default to {"action":"ADD","to_delete":[],"reason":"insufficient evidence"}.
      - "to_delete" must contain only IDs present in the Existing facts list (the values inside square brackets []).
      - UPDATE or DELETE: put the affected existing fact IDs into to_delete.
      - NOOP: to_delete must be [].

      Inputs:
      New fact:
      {new_memory}

      Existing facts:
      {existing_memories}

      Now respond with ONLY the JSON object.

  post_retrieval:
    action: none
