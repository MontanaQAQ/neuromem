# ============================================================
# PostInsert 实验: Mem0g + Semantic Consolidation
# 记忆体结构: Mem0g (向量 + 知识图谱)
# PostInsert 策略: conflict_resolution.semantic_consolidation
# 配置名称: Mem0g_locomo_semantic_consolidation_post_insert.yaml
# ============================================================

runtime:
  dataset: locomo
  memory_insert_verbose: false
  memory_test_verbose: true
  test_segments: 10
  service_timeout: 600.0
  prompt_template: |
    Based on the above context, answer the following question concisely.

    Question: {question}
    Answer:
  prompt_template_category5: |
    Based on the above context, answer the following question.

    Question: {question}
    Answer:

  # LLM 配置
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  llm_base_url: "http://172.17.0.1:1040/v1"
  llm_model: "pangu_embedded_1b"
  max_tokens: 256
  temperature: 0
  seed: 42
  memory_name: Mem0g-postinsert-consolidation

  # Embedding 配置
  embedding_base_url: http://localhost:8091/v1
  embedding_model: BAAI/bge-m3

services:
  services_type: "hierarchical.semantic_inverted_knowledge_graph"
  semantic_inverted_knowledge_graph:
    vector_dim: 1024
    hierarchy_levels: 3
    routing_strategy: "parallel"
    enable_cross_layer_query: true
    max_hops: 3
    default_index: "semantic_index"
  memory_retrieval_adapter: none

operators:
  pre_insert:
    action: extract.triple
    extraction_method: llm
    max_triplets: 10
    keep_original: true
    triple_extraction_prompt: |
      You are a knowledge graph builder. Extract factual triples from the dialogue.
      Focus on entities (people, organizations, locations) and their relationships.

      Rules:
      1. Output format: (Subject, Predicate, Object) - one triple per line
      2. Resolve ALL pronouns to actual entity names
      3. Extract relationships, attributes, and temporal information
      4. Be concise and factual

      Dialogue:
      {dialogue}

      Triples:

  pre_retrieval:
    action: embedding

  post_insert:
    action: conflict_resolution.semantic_consolidation
    retrieve_count: 10
    min_merge_count: 5
    merge_prompt: |
      You are a memory consolidation expert. Given a list of facts about a person, your job is to:
      1. REMOVE duplicates and near-duplicates (same meaning, different wording)
      2. MERGE related facts into more complete statements
      3. REMOVE logically subsumed facts (if A contains B's meaning, remove B)

      EXAMPLES of what to consolidate:
      - "Alice likes coffee" + "Alice likes coffee a lot" → keep only "Alice likes coffee a lot"
      - "Bob works at Google" + "Bob works at Google as engineer" → keep only "Bob works at Google as engineer"
      - "Carol plans to travel" + "Carol plans to travel to Japan" → keep only "Carol plans to travel to Japan"

      RULES:
      - to_delete: List EXACT original texts to remove (duplicates, subsumed facts)
      - to_insert: Only if you need to CREATE a new merged fact not in original list
      - Prefer keeping the most informative version rather than creating new text
      - If a fact appears multiple times, delete all but one

      Facts:
      {memories}

      Respond with JSON only:
      {"to_delete": ["exact text 1", "exact text 2"], "to_insert": []}

  post_retrieval:
    action: none
