# 运行时参数配置
runtime:
  dataset: "longmemeval"  # 数据集名称
  # task_id: "group-1"  # 任务ID，可通过命令行 --task_id 覆盖
  test_segments: 5             # 测试分段数，将总问题数分成几段进行测试

  # Prompt 模板配置（阶段二：MemoryTest）
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM Generator 配置
  # 配置1（Llama-3.1-8B，用于对比）：
  # api_key: "token-abc123"
  # base_url: "http://sage2:8000/v1"
  # model_name: "/home/cyb/Llama-3.1-8B-Instruct"
  # max_tokens: 32
  # temperature: 0
  # seed: 42

  # 新配置（PanGu Embedded 1B）：
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: "stm"

# 服务配置
services:
  services_type: "partitional.fifo_queue"  # 记忆服务：<类型>.<具体实现>
  fifo_queue:
    max_size: 5  # FIFO队列最大容量（轮次）
  memory_retrieval_adapter: "none"



# Operator 配置
operators:
  pre_insert:
    action: "none"  # 插入前操作: none, validate, transform
  pre_retrieval:
    action: "none"  # 检索前操作: none, optimize, validate
  post_insert:
    action: "none"  # 插入后操作
  post_retrieval:
    action: "none"  # 后检索操作: none（默认会格式化对话历史）
    # 阶段一：对话历史格式化Prompt（PostRetrieval）
    conversation_format_prompt: |
      The following is some history information.
