# ============================================================
# MemoryOS Pipeline 配置（简化实现版）
# 论文: Memory OS of AI Agent
#
# 原生设计: 三层 STM/MTM/LPM + Heat Score + Tier Migration
# 当前实现: Feature+FIFO+Segment 三索引组合（近似模拟）
#
# 说明：
#   - 缺少 hierarchical_memory 服务，使用 feature_queue_segment_combination 替代
#   - FIFO 索引 ≈ STM（最新20条对话）
#   - Segment 索引 ≈ MTM（时间窗口分段）
#   - Feature 索引 ≈ LPM（BM25 关键词检索）
#   - 无法实现 heat-based tier migration（服务不支持）
# ============================================================

runtime:
  dataset: "locomo"
  test_segments: 5

  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when": just the date/time
    - For "why": start with "because"

    Q: {question}
    A:
  # LLM 配置
  # 配置1（Llama-3.1-8B，用于对比）：
  # api_key: "token-abc123"
  # base_url: "http://sage2:8000/v1"
  # model_name: "/home/cyb/Llama-3.1-8B-Instruct"
  # max_tokens: 32
  # temperature: 0
  # seed: 42

  # 新配置（PanGu Embedded 1B）：
  api_key: "iloveshuhao"
  base_url: "http://172.17.0.1:1040/v1"
  model_name: "pangu_embedded_1b"
  max_tokens: 32
  temperature: 0
  seed: 42
  memory_name: "MemoryOS"

  # Embedding 配置
  embedding_base_url: "http://localhost:8091/v1"
  embedding_model: "BAAI/bge-m3"

# ============================================================
# 服务配置
# ============================================================
services:
  services_type: "partitional.feature_queue_segment_combination"
  feature_queue_segment_combination:
    vector_dim: 1024                  # BAAI/bge-m3 向量维度
    fifo_max_size: 20                 # FIFO队列大小（对应原STM容量）
    segment_strategy: "time"          # 分段策略：time/keyword/topic
    segment_threshold: 3600           # 1小时分段（对应原MTM的Session gap）
    enable_feature_extraction: true   # 启用特征提取（对应原BM25索引）
    combination_strategy: "weighted"  # 组合策略
    weights:
      feature_index: 0.3              # Feature权重（对应原LPM知识）
      fifo_index: 0.4                 # FIFO权重（对应原STM最新对话）
      segment_index: 0.3              # Segment权重（对应原MTM上下文）
  memory_retrieval_adapter: "none"

# ============================================================
# Operator 配置
# ============================================================
operators:
  # ----------------------------------------------------------
  # PreInsert: 无需任何前置处理
  # 原因:
  #   1. MemoryOS 论文中 Fscore 计算在 Insert 时进行（由服务层负责）
  #   2. 热度初始值为 0（由服务层初始化）
  #   3. Multi-summary 在 STM→MTM 迁移时生成（PostInsert）
  #   4. Profile/Knowledge 在 MTM→LPM 迁移时提取（PostInsert）
  # ----------------------------------------------------------
  pre_insert:
    action: "none"

  # ----------------------------------------------------------
  # PostInsert: 暂不实现（简化版）
  #
  # 论文原设计: heat_migration (STM→MTM→LPM tier迁移)
  # 当前限制: feature_queue_segment_combination 服务不支持 tier 概念
  #
  # 被禁用的功能:
  #   - STM→MTM 迁移 (需要 tier=0→1 更新)
  #   - MTM→LPM Profile提取 (需要 tier=1→2 更新)
  #   - Heat-based 热度淘汰 (需要 heat 字段和阈值判断)
  #
  # 替代方案:
  #   - FIFO 索引自动淘汰超过 max_size(20) 的旧记忆
  #   - Segment 索引按时间窗口自动分段
  #   - 无需显式迁移，检索时加权融合三索引结果
  # ----------------------------------------------------------
  post_insert:
    action: "none"

  # ----------------------------------------------------------
  # PreRetrieval: 暂不实现（简化版）
  #
  # 论文原设计: 关键词提取用于 Fscore 计算 (MTM Segment 选择)
  # 当前简化: 服务内部已实现加权检索，无需额外预处理
  #
  # 说明:
  #   - Feature 索引 (BM25) 已自动处理关键词匹配
  #   - Segment 索引根据时间窗口自动选择
  #   - 三索引加权融合无需显式 Fscore 计算
  # ----------------------------------------------------------
  pre_retrieval:
    action: "none"

  # ----------------------------------------------------------
  # PostRetrieval: 直接透传（简化版）
  #
  # 论文原设计: 多层并行检索 (STM+MTM+LPM) 后合并
  # 当前简化: 服务已实现三索引加权融合检索，无需后处理
  #
  # 说明:
  #   - feature_queue_segment_combination 服务的 retrieve() 方法
  #     已自动按权重融合三个索引结果:
  #       * feature_index (0.3) ≈ LPM 知识
  #       * fifo_index (0.4) ≈ STM 最新对话
  #       * segment_index (0.3) ≈ MTM 上下文
  #   - 检索结果已包含三层信息，直接使用即可
  # ----------------------------------------------------------
  post_retrieval:
    action: "none"
