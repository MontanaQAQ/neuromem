name: CI

on:
  push:
    branches: [main-dev, feat/*]
  pull_request:
    branches: [main-dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run Pre-commit Checks
        run: |
          pre-commit run --all-files --show-diff-on-failure || {
            echo ""
            echo "❌ 代码质量检查失败！"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "💡 本地复现和修复方法："
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "1️⃣ 安装 pre-commit（一次性）："
            echo "   pip install pre-commit"
            echo "   pre-commit install  # 安装 git hooks"
            echo ""
            echo "2️⃣ 运行检查（与CI完全一致）："
            echo "   pre-commit run --all-files"
            echo ""
            echo "3️⃣ 自动修复大多数问题："
            echo "   pre-commit run --all-files  # 会自动修复格式问题"
            echo ""
            echo "4️⃣ 手动修复特定问题："
            echo "   ruff check --fix .          # 修复linting问题"
            echo "   ruff format .                # 格式化代码"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📝 注意：安装 pre-commit hooks 后，每次提交时会自动检查"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            exit 1
          }

  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install validate-pyproject
          validate-pyproject pyproject.toml

      - name: Check imports (syntax check)
        run: |
          python -c "import py_compile, pathlib; [py_compile.compile(f, doraise=True) for f in pathlib.Path('.').rglob('*.py') if 'build' not in str(f)]"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, validate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package
        run: |
          python -m build

      - name: Check Package
        run: |
          pip install twine
          twine check dist/*

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, validate, build]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        test-suite:
          - name: "Unit Tests"
            path: "tests/unit"
          - name: "Integration Tests"
            path: "tests/integration"
          - name: "E2E Tests"
            path: "tests/e2e"
          - name: "Component Tests"
            path: "tests/components"
          - name: "Performance Tests"
            path: "tests/performance"
          - name: "Root Tests"
            path: "tests/test_*.py"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,benchmark]

      - name: Run ${{ matrix.test-suite.name }}
        run: |
          pytest ${{ matrix.test-suite.path }} \
            -v \
            --tb=short \
            --color=yes \
            --strict-markers || true
        continue-on-error: true

  test-standalone:
    name: Standalone Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies Only
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Standalone Tests
        run: |
          # Test without installing the package
          pytest tests/test_neuromem_standalone.py -v --tb=short
        continue-on-error: false

  test-benchmark-readiness:
    name: Benchmark Readiness Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, validate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Package with Benchmark Support
        run: |
          python -m pip install --upgrade pip
          pip install -e .[benchmark]

      - name: Download Locomo Dataset
        run: |
          python -m sage.data.sources.locomo.download

      - name: Run Benchmark Readiness Test
        run: |
          python benchmarks/test_benchmark_readiness.py
        continue-on-error: false

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,benchmark]
          pip install pytest-cov coverage[toml]

      - name: Run Tests with Coverage
        run: |
          pytest tests/ \
            --cov=sage.neuromem \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, validate, build, test, test-standalone, test-benchmark-readiness]
    if: always()

    steps:
      - name: Check Job Status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 CI Test Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Code Quality: ${{ needs.lint.result }}"
          echo "✅ Package Validation: ${{ needs.validate.result }}"
          echo "✅ Build Check: ${{ needs.build.result }}"
          echo "✅ Test Suite: ${{ needs.test.result }}"
          echo "✅ Standalone Tests: ${{ needs.test-standalone.result }}"
          echo "✅ Benchmark Readiness: ${{ needs.test-benchmark-readiness.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test-standalone.result }}" != "success" ]; then
            echo "❌ Critical tests failed!"
            exit 1
          fi

          echo "✨ All critical tests passed!"
