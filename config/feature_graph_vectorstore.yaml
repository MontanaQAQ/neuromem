version: "2.0"
service:
  name: "feature_graph_vectorstore"
  type: "hierarchical.property_graph"
  description: "Hierarchical memory service: feature_graph_vectorstore"
collection:
  name: "feature_graph_vectorstore_memory"
  storage:
    type: "simple"
    config:
      persist_dir: "~/.local/share/sage/memory/feature_graph_vectorstore"
indexes:
  - name: "primary_index"
    type: "faiss"
    config:
      dimension: 768
      metric: "cosine"
